    <!-- AUDIO SYNTHÉTIQUE -->
    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playScratchSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(120 + Math.random() * 80, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
        }

        function playBeepSound(freq = 440) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        }

        function playSuccessSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            [523.25, 659.25, 783.99, 1046.50].forEach((freq, index) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, now + index * 0.1);
                gain.gain.setValueAtTime(0.1, now + index * 0.1);
                gain.gain.exponentialRampToValueAtTime(0.001, now + index * 0.1 + 0.3);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now + index * 0.1);
                osc.stop(now + index * 0.1 + 0.3);
            });
        }
    </script>

    <script src="secrets.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, push, update, increment, query, limitToLast } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app, databaseURL);

        const canvas = document.getElementById('scratchCanvas');
        const ctx = canvas.getContext('2d');
        const restartBtn = document.getElementById('restartBtn');
        const shareImgBtn = document.getElementById('shareImgBtn');
        let confettiColors = ['#ffc0cb', '#ff69b4', '#ffffff', '#d1a878'];
        let countdownDuration = 3; // Par défaut à 3 secondes
        let showCountdownSetting = true; // Activé par défaut

        // Gestion du compteur de visites unique (via localStorage pour ne compter qu'une fois par appareil)
        const statsRef = ref(db, 'stats');
        if (!localStorage.getItem('has_visited')) {
            update(statsRef, { visites: increment(1) });
            localStorage.setItem('has_visited', 'true');
        }

        // Écouter en temps réel les contrôles admin (compte à rebours + force reveal)
        const controlRef = ref(db, 'controle');
        onValue(controlRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                // Récupération de la décision Oui/Non pour le compte à rebours (true par défaut)
                if (data.showCountdown !== undefined) {
                    showCountdownSetting = data.showCountdown === true;
                }

                // Force reveal
                if (data.forceReveal && !revealed && !isCountingDown) {
                    isCountingDown = true;
                    if (showCountdownSetting) {
                        startCountdownAndReveal();
                    } else {
                        executeImmediateReveal();
                    }
                }
            }
        });

        // CHARGEMENT EN TEMPS RÉEL DE LA GALERIE PHOTO
        const galleryRef = ref(db, 'galerie');
        onValue(galleryRef, (snapshot) => {
            const galleryGrid = document.getElementById('galleryGrid');
            galleryGrid.innerHTML = '';
            
            const data = snapshot.val();
            if (data) {
                const photos = Object.entries(data).reverse(); // Les plus récentes en premier
                photos.forEach(([id, photo]) => {
                    const isPrivate = photo.prive === true;
                    const photoUrl = photo.url || photo.image;
                    
                    const itemDiv = document.createElement('div');
                    itemDiv.className = `gallery-item ${isPrivate ? 'private' : ''}`;
                    
                    // Si on clique, on ouvre en grand (même si floutée ou non)
                    itemDiv.onclick = () => openImageModal(photoUrl);

                    let lockHtml = isPrivate ? '<div class="lock-overlay">🔒</div>' : '';
                    
                    itemDiv.innerHTML = `
                        <img src="${photoUrl}" alt="Souvenir de galerie">
                        ${lockHtml}
                    `;
                    galleryGrid.appendChild(itemDiv);
                });
            } else {
                galleryGrid.innerHTML = '<p style="font-size: 0.85rem; color: #aaa; text-align: center; grid-column: span 2;">Aucune photo pour le moment.</p>';
            }
        });

        // Fonctions pour gérer la modale plein écran
        window.openImageModal = function(url) {
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImage');
            modalImg.src = url;
            modal.classList.add('visible');
        };

        window.closeImageModal = function() {
            const modal = document.getElementById('imageModal');
            modal.classList.remove('visible');
        };

        // VARIABLES POUR L'ENREGISTREMENT AUDIO
        let mediaRecorder;
        let audioChunks = [];
        let recordedAudioBase64 = null;

        window.toggleRecording = async function() {
            const recordBtn = document.getElementById('recordBtn');
            
            if (!mediaRecorder || mediaRecorder.state === "inactive") {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    audioChunks = [];
                    mediaRecorder = new MediaRecorder(stream);
                    
                    mediaRecorder.ondataavailable = event => {
                        audioChunks.push(event.data);
                    };

                    mediaRecorder.onstop = async () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = () => {
                            recordedAudioBase64 = reader.result;
                            document.getElementById('audioPreviewWrapper').classList.add('visible');
                        };
                    };

                    mediaRecorder.start();
                    recordBtn.innerText = "🛑 Arrêter l'enregistrement";
                    recordBtn.classList.add('recording');
                } catch (err) {
                    alert("Impossible d'accéder au microphone. Vérifie les autorisations de ton navigateur.");
                }
            } else if (mediaRecorder.state === "recording") {
                mediaRecorder.stop();
                mediaRecorder.stream.getTracks().forEach(track => track.stop());
                recordBtn.innerText = "🎤 Enregistrer un vocal";
                recordBtn.classList.remove('recording');
            }
        };

        window.cancelAudio = function() {
            recordedAudioBase64 = null;
            document.getElementById('audioPreviewWrapper').classList.remove('visible');
            document.getElementById('recordBtn').innerText = "🎤 Enregistrer un vocal";
        };

        const img = new Image();
        img.src = 'bebe.jpg';
        let isImageLoaded = false;

        img.onload = function() {
            isImageLoaded = true;
            initScratchLayer();
        };

        window.initScratchLayer = function() {
            if (!isImageLoaded) return;
            const sourceX = img.width * 0.29; 
            const sourceY = img.height * 0.56;
            const sourceSize = img.width * 0.44;

            ctx.globalCompositeOperation = 'source-over';
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.beginPath();
            ctx.arc(canvas.width / 2, canvas.height / 2, canvas.width / 2, 0, Math.PI * 2);
            ctx.clip();

            ctx.drawImage(
                img, 
                sourceX, sourceY, sourceSize, sourceSize, 
                0, 0, canvas.width, canvas.height
            );
            ctx.restore();
            canvas.style.display = 'block';
            canvas.style.opacity = '1';
            canvas.style.pointerEvents = 'auto';
            revealed = false;
            isCountingDown = false;
            document.getElementById('countdownOverlay').classList.remove('visible');
            restartBtn.classList.remove('visible');
            shareImgBtn.classList.remove('visible');
            document.getElementById('guestbookSection').classList.remove('visible');
        }

        const annonceRef = ref(db, 'annonce');
        onValue(annonceRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                document.getElementById('textBebe').innerText = data.ligneBebe || "BÉBÉ EST...";
                document.getElementById('textCoeur').innerText = data.ligneCoeur || "— ♡ —";
                document.getElementById('textSexe').innerText = data.ligneSexe || "...";
                
                const motDouxEl = document.getElementById('textMotDoux');
                if (data.ligneMotDoux) {
                    motDouxEl.innerText = data.ligneMotDoux;
                    motDouxEl.style.display = 'block';
                } else {
                    motDouxEl.style.display = 'none';
                }

                if (data.confettiColors) confettiColors = data.confettiColors;
                
                if (data.countdownDuration !== undefined) {
                    countdownDuration = parseInt(data.countdownDuration) || 3;
                }
            }
        });

        let isDrawing = false;
        let revealed = false;
        let isCountingDown = false;

        function getPosition(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function scratch(e) {
            if (!isDrawing || revealed || isCountingDown) return;
            const pos = getPosition(e);
            ctx.globalCompositeOperation = 'destination-out';
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, 22, 0, Math.PI * 2, false);
            ctx.fill();
            
            playScratchSound();
            checkProgress();
        }

        window.showGuestbook = function() {
            document.getElementById('guestbookSection').classList.add('visible');
            loadMessages();
        };

        window.postMessage = function() {
            const name = document.getElementById('visitorName').value.trim();
            const message = document.getElementById('visitorMessage').value.trim();
            const privacySelected = document.querySelector('input[name="msgPrivacy"]:checked').value;
            const isPrivate = privacySelected === 'private';

            if (!name || (!message && !recordedAudioBase64)) {
                alert("Merci d'indiquer ton nom et d'écrire un mot ou d'enregistrer un vocal !");
                return;
            }

            const messageData = {
                name: name,
                message: message || "(Message vocal)",
                prive: isPrivate,
                timestamp: Date.now()
            };

            if (recordedAudioBase64) {
                messageData.audio = recordedAudioBase64;
            }

            const messagesRef = ref(db, 'livre_or');
            push(messagesRef, messageData).then((newRef) => {
                if (isPrivate) {
                    let myPrivateIds = JSON.parse(localStorage.getItem('my_private_msgs') || '[]');
                    myPrivateIds.push(newRef.key);
                    localStorage.setItem('my_private_msgs', JSON.stringify(myPrivateIds));
                }

                document.getElementById('visitorName').value = '';
                document.getElementById('visitorMessage').value = '';
                cancelAudio();
                alert(isPrivate ? "Message privé bien envoyé aux parents ! 🔒" : "Message public posté avec succès ! ✨");
                loadMessages();
            }).catch(() => {
                alert("Erreur lors de l'envoi du message.");
            });
        };

        function loadMessages() {
            const messagesRef = query(ref(db, 'livre_or'), limitToLast(50));
            onValue(messagesRef, (snapshot) => {
                const listEl = document.getElementById('messagesList');
                listEl.innerHTML = '';
                
                const data = snapshot.val();
                let displayedCount = 0;

                let myPrivateIds = JSON.parse(localStorage.getItem('my_private_msgs') || '[]');

                if (data) {
                    const entries = Object.entries(data).reverse();
                    entries.forEach(([id, item]) => {
                        const isMyPrivateMessage = item.prive === true && myPrivateIds.includes(id);

                        if (item.prive === true && !isMyPrivateMessage) return;

                        displayedCount++;
                        const div = document.createElement('div');
                        div.className = 'message-item';
                        
                        const heartDisplay = item.coeur ? '<span style="float: right; color: #e74c3c;">❤️</span>' : '';
                        const audioDisplay = item.audio ? `<audio controls src="${item.audio}"></audio>` : '';
                        const privateBadge = isMyPrivateMessage ? '<span style="font-size: 0.75rem; background: #e8ded2; padding: 2px 6px; border-radius: 4px; float: right; margin-right: 5px; color: #5a4a42;">🔒 Privé (ton message)</span>' : '';
                        
                        let reponseHtml = '';
                        if (item.reponse || item.reponseAudio) {
                            const repText = item.reponse ? `<p style="margin: 4px 0 0 0;">${escapeHtml(item.reponse)}</p>` : '';
                            const repAudio = item.reponseAudio ? `<audio controls src="${item.reponseAudio}" style="width: 100%; height: 30px; margin-top: 6px;"></audio>` : '';
                            
                            reponseHtml = `
                                <div style="margin-top: 10px; padding: 10px; background-color: #f7f3ee; border-left: 3px solid #d1a878; border-radius: 6px; font-size: 0.9rem; color: #5a4a42;">
                                    <strong style="color: #8c7355; font-size: 0.85rem;">Réponse des parents :</strong>
                                    ${repText}
                                    ${repAudio}
                                </div>
                            `;
                        }

                        div.innerHTML = `
                            ${heartDisplay}
                            ${privateBadge}
                            <strong>${escapeHtml(item.name)}</strong>
                            <p>${escapeHtml(item.message)}</p>
                            ${audioDisplay}
                            ${reponseHtml}
                        `;
                        listEl.appendChild(div);
                    });
                } 
                
                if (displayedCount === 0) {
                    listEl.innerHTML = '<p style="font-size: 0.85rem; color: #aaa; text-align: center;">Soyez le premier à laisser un mot !</p>';
                }
            });
        }

        function checkProgress() {
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const pixels = imageData.data;
            let transparentPixels = 0;
            
            for (let i = 3; i < pixels.length; i += 4) {
                if (pixels[i] < 128) {
                    transparentPixels++;
                }
            }
            
            const totalPixels = pixels.length / 4;
            const percentage = (transparentPixels / totalPixels) * 100;
            
            if (percentage > 45 && !revealed && !isCountingDown) {
                isCountingDown = true;
                update(statsRef, { grattages: increment(1) });
                
                // DÉCISION ICI : Si l'admin a activé le compte à rebours (OUI), on l'affiche. Sinon (NON), on révèle direct.
                if (showCountdownSetting) {
                    startCountdownAndReveal();
                } else {
                    executeImmediateReveal();
                }
            }
        }

        function startCountdownAndReveal() {
            canvas.style.pointerEvents = 'none';
            const countdownOverlay = document.getElementById('countdownOverlay');
            const countdownNumberEl = document.getElementById('countdownNumber');
            
            countdownOverlay.classList.add('visible');
            let currentCount = countdownDuration;
            countdownNumberEl.innerText = currentCount;
            playBeepSound(400);

            const timer = setInterval(() => {
                currentCount--;
                if (currentCount > 0) {
                    countdownNumberEl.innerText = currentCount;
                    playBeepSound(400);
                } else {
                    clearInterval(timer);
                    countdownOverlay.classList.remove('visible');
                    executeImmediateReveal();
                }
            }, 1000);
        }

        function executeImmediateReveal() {
            revealed = true;
            canvas.style.opacity = '0';
            canvas.style.pointerEvents = 'none';
            restartBtn.classList.add('visible');
            shareImgBtn.classList.add('visible');
            playSuccessSound();
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 },
                colors: confettiColors
            });
            showGuestbook();
        }

        window.resetScratch = function() {
            initScratchLayer();
        };

        window.shareRevealImage = async function() {
            const targetElement = document.getElementById('cardContainer');
            if (!targetElement) return;

            try {
                restartBtn.style.display = 'none';
                shareImgBtn.style.display = 'none';

                const canvasImg = await html2canvas(targetElement, { 
                    scale: 2, 
                    useCORS: true 
                });

                restartBtn.style.display = '';
                shareImgBtn.style.display = '';

                canvasImg.toBlob(async (blob) => {
                    const file = new File([blob], "Annonce_Bebe.png", { type: "image/png" });
                    const filesArray = [file];

                    if (navigator.canShare && navigator.canShare({ files: filesArray })) {
                        try {
                            await navigator.share({
                                title: "C'est un secret !",
                                text: "Viens découvrir le résultat de notre révélation ! 🎉",
                                files: filesArray,
                            });
                        } catch (error) {
                            console.log("Partage annulé", error);
                        }
                    } else {
                        const link = document.createElement('a');
                        link.download = 'Annonce_Bebe.png';
                        link.href = canvasImg.toDataURL('image/png');
                        link.click();
                    }
                }, 'image/png');

            } catch (error) {
                console.error("Erreur lors de la génération de l'image :", error);
                restartBtn.style.display = '';
                shareImgBtn.style.display = '';
                alert("Impossible de générer l'image sur cet appareil.");
            }
        };

        canvas.addEventListener('mousedown', (e) => { isDrawing = true; scratch(e); });
        window.addEventListener('mousemove', (e) => { if (isDrawing) scratch(e); });
        window.addEventListener('mouseup', () => { isDrawing = false; });

        canvas.addEventListener('touchstart', (e) => { isDrawing = true; scratch(e); e.preventDefault(); });
        window.addEventListener('touchmove', (e) => { if (isDrawing) scratch(e); e.preventDefault(); });
        window.addEventListener('touchend', () => { isDrawing = false; });

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
