<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Annonce Surprise !</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f5f0ea;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .card-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            aspect-ratio: 568 / 808;
            background-image: url('bebe.jpg');
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* LE MESSAGE CACHÉ */
        .hidden-message {
            position: absolute;
            bottom: 11.5%;
            left: 54.5%;
            transform: translateX(-50%);
            width: 195px;
            height: 195px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #fdfcf8;
            z-index: 1;
            text-align: center;
            font-family: serif;
        }

        .hidden-message h2 {
            font-size: 1.4rem;
            margin: 0 0 5px 0;
            color: #d1a878;
        }

        .hidden-message p {
            font-size: 0.9rem;
            margin: 0;
            color: #5a4a42;
        }

        /* Le canvas interactif */
        canvas.scratch-canvas {
            position: absolute;
            bottom: 11.5%;
            left: 54.5%;
            transform: translateX(-50%);
            width: 195px;
            height: 195px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 2;
            touch-action: none;
            background-color: transparent;
        }

        /* PETIT BOUTON SECRET DISCRET (En bas à droite de la carte) */
        .secret-admin-btn {
            position: absolute;
            bottom: 5px;
            right: 10px;
            width: 15px;
            height: 15px;
            background-color: transparent; /* Totalement transparent ou mets une couleur très proche du fond */
            border: none;
            cursor: pointer;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <!-- LE MESSAGE SECRET -->
        <div class="hidden-message">
            <h2 id="resultTitle">Chargement...</h2>
            <p id="resultSubtitle"></p>
        </div>

        <!-- LA COUCHE À GRATTER -->
        <canvas id="scratchCanvas" class="scratch-canvas" width="195" height="195"></canvas>

        <!-- BOUTON SECRET DISCRET POUR TOI -->
        <a href="interface_amie.html" class="secret-admin-btn" title="Admin"></a>
    </div>

    <!-- IMPORT CONFIG -->
    <script src="secrets.js"></script>

    <!-- IMPORT FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app, databaseURL);

        const canvas = document.getElementById('scratchCanvas');
        const ctx = canvas.getContext('2d');
        let confettiColors = ['#ffc0cb', '#ff69b4', '#ffffff', '#d1a878'];

        const img = new Image();
        img.src = 'bebe.jpg';
        let isImageLoaded = false;

        img.onload = function() {
            isImageLoaded = true;
            initScratchLayer();
        };

        function initScratchLayer() {
            if (!isImageLoaded) return;
            const sourceX = img.width * 0.29; 
            const sourceY = img.height * 0.56;
            const sourceSize = img.width * 0.44;

            ctx.save();
            ctx.beginPath();
            ctx.arc(canvas.width / 2, canvas.height / 2, canvas.width / 2, 0, Math.PI * 2);
            ctx.clip();

            ctx.drawImage(
                img, 
                sourceX, sourceY, sourceSize, sourceSize, 
                0, 0, canvas.width, canvas.height
            );
            ctx.restore();
        }

        // On écoute le secret choisi par ton amie dans Firebase
        const annonceRef = ref(db, 'annonce');
        onValue(annonceRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                document.getElementById('resultTitle').innerText = data.messageH2;
                document.getElementById('resultSubtitle').innerText = data.messageP;
                if (data.confettiColors) confettiColors = data.confettiColors;
            }
        });

        let isDrawing = false;
        let revealed = false;

        function getPosition(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function scratch(e) {
            if (!isDrawing || revealed) return;
            const pos = getPosition(e);
            ctx.globalCompositeOperation = 'destination-out';
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, 22, 0, Math.PI * 2, false);
            ctx.fill();
            checkProgress();
        }

        function checkProgress() {
            if (revealed) return;
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            let transparentPixels = 0;
            for (let i = 3; i < imageData.data.length; i += 4) {
                if (imageData.data[i] < 10) transparentPixels++;
            }
            let percentage = (transparentPixels / (imageData.data.length / 4)) * 100;
            
            if (percentage > 40) {
                revealed = true;
                canvas.style.transition = 'opacity 0.8s ease';
                canvas.style.opacity = '0';
                setTimeout(() => { canvas.style.display = 'none'; }, 800);

                confetti({ particleCount: 100, spread: 70, origin: { y: 0.7 }, colors: confettiColors });
            }
        }

        canvas.addEventListener('mousedown', (e) => { isDrawing = true; scratch(e); });
        canvas.addEventListener('mousemove', scratch);
        window.addEventListener('mouseup', () => { isDrawing = false; });
        canvas.addEventListener('touchstart', (e) => { isDrawing = true; scratch(e); });
        canvas.addEventListener('touchmove', scratch);
        window.addEventListener('touchend', () => { isDrawing = false; });
    </script>
</body>
</html>
