<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Annonce Surprise !</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        /* POP-UP DE MAINTENANCE */
        .maintenance-overlay {
           position: fixed;
           top: 0;
           left: 0;
           width: 100%;
           height: 100%;
           background-color: rgba(90, 74, 66, 0.9);
           display: flex;
           justify-content: center;
           align-items: center;
           z-index: 9999;
        }
        .maintenance-box {
           background: white;
           padding: 30px;
           border-radius: 20px;
           text-align: center;
           max-width: 320px;
           width: 90%;
           box-shadow: 0 10px 30px rgba(0,0,0,0.3);
           color: #5a4a42;
           font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
          }
        .maintenance-box h2 {
          color: #d1a878;
          margin-top: 0;
        }
       .maintenance-box p {
         font-size: 0.95rem;
         line-height: 1.4;
       }
        
        body {
            margin: 0;
            padding: 0;
            background-color: #f5f0ea;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .card-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            aspect-ratio: 568 / 808;
            background-image: url('bebe.jpg');
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* LE MESSAGE CACHÉ SUR 3 LIGNES + MOT DOUX */
        .hidden-message {
            position: absolute;
            bottom: 11.5%;
            left: 54.5%;
            transform: translateX(-50%);
            width: 195px;
            height: 195px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #e8ded2;
            z-index: 1;
            text-align: center;
            font-family: serif;
            padding: 10px;
            box-sizing: border-box;
        }

        .hidden-message .ligne-bebe {
            font-size: 0.8rem;
            color: #5a4a42;
            margin: 0;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .hidden-message .ligne-coeur {
            font-size: 0.9rem;
            margin: 2px 0;
            color: #8c7355;
        }

        .hidden-message h2 {
            font-size: 0.95rem;
            margin: 0;
            color: #5a4a42;
            line-height: 1.1;
        }

        .hidden-message .ligne-mot-doux {
            font-size: 0.7rem;
            color: #7a685e;
            margin-top: 4px;
            font-style: italic;
        }

        /* Le canvas interactif à gratter */
        canvas.scratch-canvas {
            position: absolute;
            bottom: 11.5%;
            left: 54.5%;
            transform: translateX(-50%);
            width: 195px;
            height: 195px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 2;
            touch-action: none;
            background-color: transparent;
        }

        /* BOUTON RECOMMENCER (Caché au départ) */
        .restart-btn {
            position: absolute;
            bottom: 2%;
            left: 50%;
            transform: translateX(-50%);
            background-color: #d1a878;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            z-index: 5;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease, background 0.3s;
        }
        .restart-btn.visible {
            opacity: 1;
            pointer-events: auto;
        }
        .restart-btn:hover {
            background-color: #bc9363;
        }

        /* PETIT BOUTON SECRET DISCRET */
        .secret-admin-btn {
            position: absolute;
            bottom: 5px;
            right: 10px;
            width: 15px;
            height: 15px;
            background-color: transparent;
            border: none;
            cursor: pointer;
            z-index: 10;
        }
    </style>
</head>
<body>
    <!-- POP-UP DE MAINTENANCE (Actif) -->
    <!-- POP-UP DE MAINTENANCE AVEC ACCÈS ADMIN -->
   <div id="maintenancePopup" class="maintenance-overlay">
      <div class="maintenance-box">
        <h2>🛠️ Site en maintenance</h2>
        <p>Le site est temporairement indisponible pour quelques modifications. Revenez un peu plus tard ! ✨</p>
        <hr style="border: 0; border-top: 1px solid #eee; margin: 15px 0;">
        <p style="font-size: 0.85rem; color: #888;">Accès administrateur :</p>
        <input type="password" id="adminPasswordInput" placeholder="Mot de passe admin" style="width: 100%; padding: 10px; margin-bottom: 10px; border: 2px solid #ddd; border-radius: 8px; box-sizing: border-box; text-align: center; outline: none;">
        <button onclick="checkAdminAccess()" style="background-color: #d1a878; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold;">Entrer</button>
        <p id="adminErrorMsg" style="color: red; font-size: 0.8rem; margin-top: 8px;"></p>
     </div>
  </div>

    <div class="card-container">
        <!-- LE MESSAGE SECRET -->
        <div class="hidden-message">
            <p class="ligne-bebe" id="textBebe">BÉBÉ EST...</p>
            <div class="ligne-coeur" id="textCoeur">— ♡ —</div>
            <h2 id="textSexe">...</h2>
            <div class="ligne-mot-doux" id="textMotDoux"></div>
        </div>

        <!-- LA COUCHE À GRATTER -->
        <canvas id="scratchCanvas" class="scratch-canvas" width="195" height="195"></canvas>

        <!-- BOUTON RECOMMENCER -->
        <button id="restartBtn" class="restart-btn" onclick="resetScratch()">Recommencer 🔄</button>

        <a href="interface_amie.html" class="secret-admin-btn" title="Admin"></a>
    </div>

    <!-- AUDIO SYNTHÉTIQUE POUR LE GRATTAGE (Sons générés dynamiquement sans fichiers externes) -->
    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playScratchSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(120 + Math.random() * 80, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
        }

        function playSuccessSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            [523.25, 659.25, 783.99, 1046.50].forEach((freq, index) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, now + index * 0.1);
                gain.gain.setValueAtTime(0.1, now + index * 0.1);
                gain.gain.exponentialRampToValueAtTime(0.001, now + index * 0.1 + 0.3);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now + index * 0.1);
                osc.stop(now + index * 0.1 + 0.3);
            });
        }
    </script>

    <script src="secrets.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app, databaseURL);

        const canvas = document.getElementById('scratchCanvas');
        const ctx = canvas.getContext('2d');
        const restartBtn = document.getElementById('restartBtn');
        let confettiColors = ['#ffc0cb', '#ff69b4', '#ffffff', '#d1a878'];

        const img = new Image();
        img.src = 'bebe.jpg';
        let isImageLoaded = false;

        img.onload = function() {
            isImageLoaded = true;
            initScratchLayer();
        };
        window.checkAdminAccess = function() {
          const saisie = document.getElementById('adminPasswordInput').value;
          // Tu peux changer "bebe2026" par le mot de passe de ton choix
         if (saisie === "admin2000") {
         document.getElementById('maintenancePopup').style.display = 'none';
       } else {
          document.getElementById('adminErrorMsg').innerText = "Mot de passe incorrect !";
      }
     };
        

        window.initScratchLayer = function() {
            if (!isImageLoaded) return;
            const sourceX = img.width * 0.29; 
            const sourceY = img.height * 0.56;
            const sourceSize = img.width * 0.44;

            ctx.globalCompositeOperation = 'source-over';
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.beginPath();
            ctx.arc(canvas.width / 2, canvas.height / 2, canvas.width / 2, 0, Math.PI * 2);
            ctx.clip();

            ctx.drawImage(
                img, 
                sourceX, sourceY, sourceSize, sourceSize, 
                0, 0, canvas.width, canvas.height
            );
            ctx.restore();
            canvas.style.display = 'block';
            canvas.style.opacity = '1';
            revealed = false;
            restartBtn.classList.remove('visible');
        }

        const annonceRef = ref(db, 'annonce');
        onValue(annonceRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                document.getElementById('textBebe').innerText = data.ligneBebe || "BÉBÉ EST...";
                document.getElementById('textCoeur').innerText = data.ligneCoeur || "— ♡ —";
                document.getElementById('textSexe').innerText = data.ligneSexe || "...";
                
                const motDouxEl = document.getElementById('textMotDoux');
                if (data.ligneMotDoux) {
                    motDouxEl.innerText = data.ligneMotDoux;
                    motDouxEl.style.display = 'block';
                } else {
                    motDouxEl.style.display = 'none';
                }

                if (data.confettiColors) confettiColors = data.confettiColors;
            }
        });

        let isDrawing = false;
        let revealed = false;

        function getPosition(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function scratch(e) {
            if (!isDrawing || revealed) return;
            const pos = getPosition(e);
            ctx.globalCompositeOperation = 'destination-out';
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, 22, 0, Math.PI * 2, false);
            ctx.fill();
            
            playScratchSound();
            checkProgress();
        }

        function checkProgress() {
            if (revealed) return;
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            let transparentPixels = 0;
            for (let i = 3; i < imageData.data.length; i += 4) {
                if (imageData.data[i] < 10) transparentPixels++;
            }
            let percentage = (transparentPixels / (imageData.data.length / 4)) * 100;
            
            if (percentage > 40) {
                revealed = true;
                canvas.style.transition = 'opacity 0.8s ease';
                canvas.style.opacity = '0';
                setTimeout(() => { canvas.style.display = 'none'; }, 800);

                playSuccessSound();
                confetti({ 
                    particleCount: 120, 
                    spread: 80, 
                    origin: { y: 0.7 }, 
                    colors: confettiColors,
                    shapes: ['circle', 'square']
                });

                restartBtn.classList.add('visible');
            }
        }

        window.resetScratch = function() {
            initScratchLayer();
        };

        canvas.addEventListener('mousedown', (e) => { isDrawing = true; scratch(e); });
        canvas.addEventListener('mousemove', scratch);
        window.addEventListener('mouseup', () => { isDrawing = false; });
        canvas.addEventListener('touchstart', (e) => { isDrawing = true; scratch(e); });
        canvas.addEventListener('touchmove', scratch);
        window.addEventListener('touchend', () => { isDrawing = false; });
    </script>
</body>
</html>
