<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Annonce Surprise !</title>
    <!-- Lien pour la PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#d1a878">
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f5f0ea;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: none;
        }

        .card-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            aspect-ratio: 568 / 808;
            background-image: url('bebe.jpg');
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* LE MESSAGE CACHÉ */
        .hidden-message {
            position: absolute;
            bottom: 11.5%;
            left: 54.5%;
            transform: translateX(-50%);
            width: 195px;
            height: 195px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #e8ded2;
            z-index: 1;
            text-align: center;
            font-family: serif;
            padding: 10px;
            box-sizing: border-box;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .hidden-message.visible {
            opacity: 1;
        }

        .hidden-message .ligne-bebe {
            font-size: 0.8rem;
            color: #5a4a42;
            margin: 0;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .hidden-message .ligne-coeur {
            font-size: 0.9rem;
            margin: 2px 0;
            color: #8c7355;
        }

        .hidden-message h2 {
            font-size: 0.95rem;
            margin: 0;
            color: #5a4a42;
            line-height: 1.1;
        }

        .hidden-message .ligne-mot-doux {
            font-size: 0.7rem;
            color: #7a685e;
            margin-top: 4px;
            font-style: italic;
        }

        /* COMPTE À REBOURS VISUEL DYNAMIQUE */
        #countdownOverlay {
            position: absolute;
            bottom: 11.5%;
            left: 54.5%;
            transform: translateX(-50%);
            width: 195px;
            height: 195px;
            border-radius: 50%;
            background-color: #e8ded2;
            z-index: 4;
            display: none;
            align-items: center;
            justify-content: center;
            font-family: serif;
            font-size: 4rem;
            color: #5a4a42;
            font-weight: bold;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.1);
        }

        /* CANVAS DE GRATTAGE FLUIDE */
        .scratch-canvas {
            position: absolute;
            bottom: 11.5%;
            left: 54.5%;
            transform: translateX(-50%);
            width: 195px;
            height: 195px;
            border-radius: 50%;
            z-index: 3;
            touch-action: none;
            cursor: pointer;
        }

        /* LA PIÈCE D'OR FLOTTANTE */
        #goldCoin {
            position: absolute;
            width: 55px;
            height: 55px;
            pointer-events: none;
            z-index: 99999;
            transform: translate(-50%, -50%);
            display: none;
            filter: drop-shadow(0 8px 10px rgba(0,0,0,0.5));
        }

        /* BOUTON RECOMMENCER */
        .restart-btn {
            position: absolute;
            bottom: 2%;
            left: 50%;
            transform: translateX(-50%);
            background-color: #d1a878;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            z-index: 5;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease, background 0.3s;
        }
        .restart-btn.visible {
            opacity: 1;
            pointer-events: auto;
        }
        .restart-btn:hover {
            background-color: #bc9363;
        }

        /* PETIT BOUTON SECRET DISCRET */
        .secret-admin-btn {
            position: absolute;
            bottom: 5px;
            right: 10px;
            width: 15px;
            height: 15px;
            background-color: transparent;
            border: none;
            cursor: pointer;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="card-container" id="cardContainer">
        <!-- LE MESSAGE SECRET -->
        <div class="hidden-message" id="hiddenMessage">
            <p class="ligne-bebe" id="textBebe">BÉBÉ n'EST...</p>
            <div class="ligne-coeur" id="textCoeur">— ♡ —</div>
            <h2 id="textSexe">...</h2>
            <div class="ligne-mot-doux" id="textMotDoux"></div>
        </div>

        <!-- COMPTE À REBOURS VISUEL -->
        <div id="countdownOverlay">3</div>

        <!-- ZONE DE GRATTAGE CANVAS -->
        <canvas id="scratchCanvas" class="scratch-canvas" width="195" height="195"></canvas>

        <!-- BOUTON RECOMMENCER -->
        <button id="restartBtn" class="restart-btn" onclick="resetScratch()">Recommencer 🔄</button>

        <a href="interface_amie.html" class="secret-admin-btn" title="Admin"></a>
    </div>

    <!-- LA PIÈCE D'OR VECTORIELLE -->
    <div id="goldCoin">
        <svg viewBox="0 0 100 100" width="100%" height="100%">
            <defs>
                <radialGradient id="coinGrad" cx="35%" cy="35%" r="65%">
                    <stop offset="0%" stop-color="#fff275"/>
                    <stop offset="40%" stop-color="#ffd700"/>
                    <stop offset="80%" stop-color="#cca100"/>
                    <stop offset="100%" stop-color="#997500"/>
                </radialGradient>
            </defs>
            <circle cx="50" cy="50" r="48" fill="#b8860b"/>
            <circle cx="50" cy="50" r="42" fill="url(#coinGrad)"/>
            <circle cx="50" cy="50" r="36" fill="none" stroke="#997500" stroke-width="2" stroke-dasharray="4,2"/>
            <polygon points="50,22 56,38 74,38 60,48 65,65 50,55 35,65 40,48 26,38 44,38" fill="#fff5a5" stroke="#cca100" stroke-width="1.5"/>
        </svg>
    </div>

    <!-- AUDIO SYNTHÉTIQUE -->
    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playScratchSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(120 + Math.random() * 80, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
        }

        function playBeepSound(freq = 440) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        }

        function playSuccessSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            [523.25, 659.25, 783.99, 1046.50].forEach((freq, index) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, now + index * 0.1);
                gain.gain.setValueAtTime(0.1, now + index * 0.1);
                gain.gain.exponentialRampToValueAtTime(0.001, now + index * 0.1 + 0.3);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now + index * 0.1);
                osc.stop(now + index * 0.1 + 0.3);
            });
        }
    </script>

    <script src="secrets.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch((err) => {
                    console.log('Erreur Service Worker: ', err);
                });
            });
        }

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app, databaseURL);

        const canvas = document.getElementById('scratchCanvas');
        const ctx = canvas.getContext('2d');
        const hiddenMessage = document.getElementById('hiddenMessage');
        const countdownOverlay = document.getElementById('countdownOverlay');
        const restartBtn = document.getElementById('restartBtn');
        const goldCoin = document.getElementById('goldCoin');
        
        let confettiColors = ['#ffc0cb', '#ff69b4', '#ffffff', '#d1a878'];
        let countdownSeconds = 3; // Valeur par défaut si non paramétrée

        let isScratchingFinished = false;
        let revealed = false;
        let isDrawing = false;

        function initCanvas() {
            isScratchingFinished = false;
            revealed = false;
            restartBtn.classList.remove('visible');
            hiddenMessage.classList.remove('visible');
            countdownOverlay.style.display = 'none';
            canvas.style.display = 'block';
            canvas.style.opacity = '1';

            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = '#bfa787';
            ctx.beginPath();
            ctx.arc(97.5, 97.5, 97.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#a89070';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        initCanvas();

        const annonceRef = ref(db, 'annonce');
        onValue(annonceRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                document.getElementById('textBebe').innerText = data.ligneBebe || "BÉBÉ EST...";
                document.getElementById('textCoeur').innerText = data.ligneCoeur || "— ♡ —";
                document.getElementById('textSexe').innerText = data.ligneSexe || "...";
                
                const motDouxEl = document.getElementById('textMotDoux');
                if (data.ligneMotDoux) {
                    motDouxEl.innerText = data.ligneMotDoux;
                    motDouxEl.style.display = 'block';
                } else {
                    motDouxEl.style.display = 'none';
                }

                if (data.confettiColors) confettiColors = data.confettiColors;
                
                // Récupération dynamique du temps du chrono configuré dans l'interface amie
                if (data.countdownSeconds !== undefined) {
                    countdownSeconds = parseInt(data.countdownSeconds, 10);
                }
            }
        });

        function moveCoin(clientX, clientY) {
            goldCoin.style.left = clientX + 'px';
            goldCoin.style.top = clientY + 'px';
        }

        function scratch(e) {
            if (isScratchingFinished || !isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX || e.touches[0].clientX) - rect.left;
            const y = (e.clientY || e.touches[0].clientY) - rect.top;

            ctx.globalCompositeOperation = 'destination-out';
            ctx.beginPath();
            ctx.arc(x, y, 22, 0, Math.PI * 2);
            ctx.fill();

            playScratchSound();
            checkProgress();
        }

        function checkProgress() {
            if (isScratchingFinished) return;
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            let clearedPixels = 0;
            let totalPixels = 0;

            for (let i = 3; i < imageData.data.length; i += 4) {
                if (Math.hypot((i/4)%canvas.width - 97.5, Math.floor((i/4)/canvas.width) - 97.5) < 95) {
                    totalPixels++;
                    if (imageData.data[i] === 0) {
                        clearedPixels++;
                    }
                }
            }

            if (totalPixels > 0 && (clearedPixels / totalPixels) > 0.45) {
                startCountdownSequence();
            }
        }

        function startCountdownSequence() {
            if (isScratchingFinished) return;
            isScratchingFinished = true;

            canvas.style.display = 'none';
            goldCoin.style.display = 'none';

            // Si le temps configuré est à 0 ou moins, on révèle directement sans afficher le chrono
            if (countdownSeconds <= 0) {
                triggerFinalReveal();
                return;
            }

            countdownOverlay.style.display = 'flex';
            let count = countdownSeconds;
            countdownOverlay.innerText = count;
            playBeepSound(400);

            const timer = setInterval(() => {
                count--;
                if (count > 0) {
                    countdownOverlay.innerText = count;
                    playBeepSound(400 + (countdownSeconds - count) * 150);
                } else {
                    clearInterval(timer);
                    countdownOverlay.style.display = 'none';
                    triggerFinalReveal();
                }
            }, 1000);
        }

        function triggerFinalReveal() {
            if (revealed) return;
            revealed = true;

            hiddenMessage.classList.add('visible');

            playSuccessSound();
            confetti({ 
                particleCount: 120, 
                spread: 80, 
                origin: { y: 0.7 }, 
                colors: confettiColors,
                shapes: ['circle', 'square']
            });

            restartBtn.classList.add('visible');
        }

        window.resetScratch = function() {
            initCanvas();
            goldCoin.style.display = 'none';
        };

        canvas.addEventListener('mousedown', (e) => {
            if (isScratchingFinished) return;
            isDrawing = true;
            goldCoin.style.display = 'block';
            scratch(e);
        });

        window.addEventListener('mousemove', (e) => {
            moveCoin(e.clientX, e.clientY);
            if (isDrawing) scratch(e);
        });

        window.addEventListener('mouseup', () => {
            isDrawing = false;
            goldCoin.style.display = 'none';
        });

        canvas.addEventListener('touchstart', (e) => {
            if (isScratchingFinished) return;
            isDrawing = true;
            if (e.touches.length > 0) {
                goldCoin.style.display = 'block';
                moveCoin(e.touches[0].clientX, e.touches[0].clientY);
                scratch(e);
            }
        }, { passive: false });

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                moveCoin(e.touches[0].clientX, e.touches[0].clientY);
                if (isDrawing) {
                    e.preventDefault();
                    scratch(e);
                }
            }
        }, { passive: false });

        window.addEventListener('touchend', () => {
            isDrawing = false;
            goldCoin.style.display = 'none';
        });
    </script>
</body>
</html>
