<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace Secret - Choix du Sexe</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f0ea, #e8dfd8);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #5a4a42;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        h2 {
            margin-top: 0;
            color: #d1a878;
        }

        input[type="password"] {
            width: 80%;
            padding: 12px;
            margin: 15px 0;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            text-align: center;
        }

        button {
            background-color: #d1a878;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.3s;
            margin: 5px;
        }

        button:hover {
            background-color: #bc9363;
        }

        .hidden {
            display: none;
        }

        .btn-fille {
            background-color: #ffb6c1;
            color: #5a4a42;
            font-weight: bold;
            font-size: 1.1rem;
            width: 100%;
            margin: 10px 0;
            padding: 15px;
        }
        .btn-fille:hover { background-color: #ff9eaa; }

        .btn-garcon {
            background-color: #add8e6;
            color: #5a4a42;
            font-weight: bold;
            font-size: 1.1rem;
            width: 100%;
            margin: 10px 0;
            padding: 15px;
        }
        .btn-garcon:hover { background-color: #92cce0; }

        #status {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- ÉCRAN DE CONNEXION -->
    <div id="loginScreen" class="container">
        <h2>🔒 Espace Réservé</h2>
        <p>Entre le mot de passe secret :</p>
        <input type="password" id="passwordInput" placeholder="Mot de passe">
        <br>
        <button onclick="checkPassword()">Se connecter</button>
        <p id="errorMsg" style="color: red; font-size: 0.9rem;"></p>
    </div>

    <!-- INTERFACE DE SÉLECTION (Cachée par défaut) -->
    <div id="adminInterface" class="container hidden">
        <h2>Chosis le secret 🤫</h2>
        <p>Sélectionne le résultat qui sera affiché sur la carte :</p>
        
        <button class="btn-fille" onclick="setChoice('fille')">C'est une Fille ! 💖</button>
        <button class="btn-garcon" onclick="setChoice('garcon')">C'est un Garçon ! 💙</button>
        
        <p id="status"></p>
    </div>

    <!-- IMPORT CONFIG -->
    <script src="secrets.js"></script>

    <!-- IMPORT FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app, databaseURL);

        // LE MOT DE PASSE SECRET (Tu peux le changer ici entre les guillemets)
        const MOT_DE_PASSE_SECRET = "bebe2026"; 

        window.checkPassword = function() {
            const saisie = document.getElementById('passwordInput').value;
            if (saisie === MOT_DE_PASSE_SECRET) {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('adminInterface').classList.remove('hidden');
            } else {
                document.getElementById('errorMsg').innerText = "Mot de passe incorrect !";
            }
        };

        window.setChoice = function(sexe) {
            const annonceRef = ref(db, 'annonce');
            
            let dataToSend = {};
            if (sexe === 'fille') {
                dataToSend = {
                    messageH2: "C'est une Fille !",
                    messageP: "Félicitations !",
                    confettiColors: ['#ffc0cb', '#ff69b4', '#ffffff']
                };
            } else {
                dataToSend = {
                    messageH2: "C'est un Garçon !",
                    messageP: "Félicitations !",
                    confettiColors: ['#add8e6', '#87ceeb', '#ffffff']
                };
            }

            set(annonceRef, dataToSend).then(() => {
                document.getElementById('status').style.color = "green";
                document.getElementById('status').innerText = "Choix enregistré avec succès ! ✨";
                confetti({ particleCount: 80, spread: 60, origin: { y: 0.6 } });
            }).catch((error) => {
                document.getElementById('status').style.color = "red";
                document.getElementById('status').innerText = "Erreur lors de l'enregistrement.";
            });
        }
    </script>
</body>
</html>
