<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interface Amie - Administration</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f0ea;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .admin-container {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
            box-sizing: border-box;
        }

        h2 {
            color: #5a4a42;
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.4rem;
        }
        input[type="password"], input[type="text"] {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            text-align: center;
            box-sizing: border-box;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #5a4a42;
            font-weight: bold;
            font-size: 0.9rem;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1a878;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 0.95rem;
            background-color: #faf8f5;
        }

        input:focus {
            outline: none;
            border-color: #bc9363;
            background-color: #fff;
        }

        .btn-save {
            width: 100%;
            background-color: #d1a878;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
            margin-top: 10px;
        }

        .btn-save:hover {
            background-color: #bc9363;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #8c7355;
            text-decoration: none;
            font-size: 0.85rem;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        #statusMessage {
            margin-top: 15px;
            text-align: center;
            font-size: 0.85rem;
            font-weight: bold;
        }
    </style>
</head>
<body>
        <!-- ÉCRAN DE CONNEXION -->
    <div id="loginScreen" class="container">
        <h2>🔒 Espace Réservé</h2>
        <p>Entre le mot de passe secret :</p>
        <input type="password" id="passwordInput" placeholder="Mot de passe">
        <br>
        <button onclick="checkPassword()">Se connecter</button>
        <p id="errorMsg" style="color: red; font-size: 0.9rem; margin-top: 10px;"></p>
    </div>    
    <div class="admin-container">
        <h2>Configuration de l'Annonce</h2>
        
        <div class="form-group">
            <label for="ligneBebeInput">Ligne du haut (ex: BÉBÉ EST...) :</label>
            <input type="text" id="ligneBebeInput" placeholder="BÉBÉ EST...">
        </div>

        <div class="form-group">
            <label for="ligneCoeurInput">Ligne du cœur (ex: — ♡ —) :</label>
            <input type="text" id="ligneCoeurInput" placeholder="— ♡ —">
        </div>

        <div class="form-group">
            <label for="ligneSexeInput">Ligne principale (ex: UN PETITE FILLE) :</label>
            <input type="text" id="ligneSexeInput" placeholder="...">
        </div>

        <div class="form-group">
            <label for="ligneMotDouxInput">Mot doux optionnel :</label>
            <input type="text" id="ligneMotDouxInput" placeholder="Ex: On t'aime fort">
        </div>

        <div class="form-group">
            <label for="countdownInput">Durée du compte à rebours (en secondes) :</label>
            <input type="number" id="countdownInput" min="0" max="10" value="3">
        </div>

        <button class="btn-save" id="saveBtn">Enregistrer les modifications 💾</button>
        <div id="statusMessage"></div>

        <a href="index.html" class="back-link">← Retour à la carte</a>
    </div>

    <!-- Fichier de configuration Firebase (contient firebaseConfig et databaseURL) -->
    <script src="secrets.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app, databaseURL);

        const ligneBebeInput = document.getElementById('ligneBebeInput');
        const ligneCoeurInput = document.getElementById('ligneCoeurInput');
        const ligneSexeInput = document.getElementById('ligneSexeInput');
        const ligneMotDouxInput = document.getElementById('ligneMotDouxInput');
        const countdownInput = document.getElementById('countdownInput');
        const saveBtn = document.getElementById('saveBtn');
        const statusMessage = document.getElementById('statusMessage');

        const annonceRef = ref(db, 'annonce');

        // Charger les données actuelles dans les champs au chargement de la page
        async function loadData() {
            try {
                const snapshot = await get(annonceRef);
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    ligneBebeInput.value = data.ligneBebe || "BÉBÉ EST...";
                    ligneCoeurInput.value = data.ligneCoeur || "— ♡ —";
                    ligneSexeInput.value = data.ligneSexe || "";
                    ligneMotDouxInput.value = data.ligneMotDoux || "";
                    countdownInput.value = data.countdownSeconds !== undefined ? data.countdownSeconds : 3;
                }
            } catch (error) {
                console.error("Erreur lors du chargement :", error);
            }
        }

        loadData();

        // Sauvegarder les modifications dans Firebase
        saveBtn.addEventListener('click', async () => {
            try {
                saveBtn.disabled = true;
                saveBtn.innerText = "Enregistrement...";

                // On récupère aussi les couleurs de confettis existantes pour ne pas les écraser
                const snapshot = await get(annonceRef);
                const existingData = snapshot.exists() ? snapshot.val() : {};

                await set(annonceRef, {
                    ...existingData,
                    ligneBebe: ligneBebeInput.value,
                    ligneCoeur: ligneCoeurInput.value,
                    ligneSexe: ligneSexeInput.value,
                    ligneMotDoux: ligneMotDouxInput.value,
                    countdownSeconds: parseInt(countdownInput.value, 10) || 3
                });

                statusMessage.style.color = "#4CAF50";
                statusMessage.innerText = "Modifications enregistrées avec succès ! ✨";
                
                setTimeout(() => {
                    statusMessage.innerText = "";
                }, 3000);
            } catch (error) {
                console.error("Erreur lors de la sauvegarde :", error);
                statusMessage.style.color = "#F44336";
                statusMessage.innerText = "Erreur lors de l'enregistrement.";
            } finally {
                saveBtn.disabled = false;
                saveBtn.innerText = "Enregistrer les modifications 💾";
            }
        });
    </script>
    <!-- IMPORT CONFIG -->

</html>
