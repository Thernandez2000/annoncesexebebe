<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace Secret - Choix du Sexe</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Bibliothèque pour générer le PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f0ea, #e8dfd8);
            margin: 0;
            padding: 20px 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #5a4a42;
            overflow-y: auto;
            flex-direction: column;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 20px;
        }

        h2 {
            margin-top: 0;
            color: #d1a878;
        }

        input[type="password"], input[type="text"] {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            text-align: center;
            box-sizing: border-box;
        }

        button {
            background-color: #d1a878;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.3s;
            margin: 5px 0;
            width: 100%;
        }

        button:hover {
            background-color: #bc9363;
        }

        .hidden {
            display: none;
        }

        .btn-fille {
            background-color: #ffb6c1;
            color: #5a4a42;
            font-weight: bold;
            font-size: 1.1rem;
            margin: 8px 0;
            padding: 15px;
        }
        .btn-fille:hover { background-color: #ff9eaa; }

        .btn-garcon {
            background-color: #add8e6;
            color: #5a4a42;
            font-weight: bold;
            font-size: 1.1rem;
            margin: 8px 0;
            padding: 15px;
        }
        .btn-garcon:hover { background-color: #92cce0; }

        /* INDICATEUR DE STATUT EN DIRECT */
        .status-badge {
            background-color: #f7f3ee;
            border: 1px dashed #d1a878;
            padding: 10px;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-bottom: 15px;
            color: #5a4a42;
        }

        /* ANIMATION DE VALIDATION */
        #status {
            margin-top: 15px;
            font-weight: bold;
            font-size: 0.95rem;
            opacity: 0;
            transition: opacity 0.4s ease-in-out;
        }
        #status.show {
            opacity: 1;
        }

        .input-group {
            text-align: left;
            margin-top: 15px;
        }
        .input-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #7a685e;
        }

        /* SECTION MODÉRATION LIVRE D'OR */
        .mod-section {
            background: #fff;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
            box-sizing: border-box;
            text-align: left;
            margin-bottom: 20px;
        }
        .mod-section h3 {
            color: #8c7355;
            margin-top: 0;
            font-size: 1.1rem;
            border-bottom: 2px solid #f5f0ea;
            padding-bottom: 8px;
            text-align: center;
        }
        
        /* CARTE DE MESSAGE MODÉRATION PROPRE */
        .mod-message-item {
            background: #f9f6f0;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 12px;
            font-size: 0.9rem;
            word-break: break-word;
            overflow-wrap: break-word;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .mod-message-content {
            width: 100%;
        }
        .mod-message-item strong {
            color: #5a4a42;
        }
        .mod-message-item p {
            margin: 4px 0 0 0;
            color: #7a685e;
            word-break: break-word;
            overflow-wrap: break-word;
        }

        /* BARRE D'ACTIONS PROPRE */
        .mod-actions-bar {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
            border-top: 1px solid #eee;
            padding-top: 8px;
            margin-top: 4px;
        }
        .mod-action-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            padding: 4px 6px;
            border-radius: 6px;
            transition: background 0.2s;
        }
        .mod-action-btn:hover {
            background: #eee;
        }
        .mod-delete-btn {
            background-color: #d9534f;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: bold;
            width: auto;
            margin: 0;
        }
        .mod-delete-btn:hover {
            background-color: #c9302c;
        }

        /* DESIGN DU LIVRE POUR LE PDF */
        .book-export-wrapper {
            background-color: #ffffff;
            border: 2px solid #d1a878;
            padding: 30px;
            font-family: Arial, sans-serif;
            color: #5a4a42;
            width: 800px;
            box-sizing: border-box;
        }
        .book-page-title {
            text-align: center;
            color: #8c7355;
            font-size: 24px;
            margin-bottom: 5px;
        }
        .book-page-subtitle {
            text-align: center;
            font-size: 14px;
            color: #9c887d;
            margin-bottom: 20px;
        }
        .book-message-card {
            background: #fdfbf7;
            border-left: 4px solid #d1a878;
            padding: 12px;
            margin-bottom: 12px;
        }
        .book-message-card strong {
            color: #5a4a42;
            font-size: 14px;
        }
        .book-message-card p {
            margin: 5px 0 0 0;
            color: #7a685e;
            font-size: 13px;
        }
        .btn-pdf {
            background-color: #8c7355;
            margin-top: 15px;
        }
        .btn-pdf:hover {
            background-color: #725c43;
        }
    </style>
</head>
<body>

    <!-- ÉCRAN DE CONNEXION -->
    <div id="loginScreen" class="container">
        <h2>🔒 Espace Réservé</h2>
        <p>Entre le mot de passe secret :</p>
        <input type="password" id="passwordInput" placeholder="Mot de passe">
        <br>
        <button onclick="checkPassword()">Se connecter</button>
        <p id="errorMsg" style="color: red; font-size: 0.9rem; margin-top: 10px;"></p>
    </div>

    <!-- INTERFACE DE SÉLECTION -->
    <div id="adminInterface" class="container hidden">
        <h2>Choisis le secret 🤫</h2>
        
        <!-- Badge indicateur en direct -->
        <div class="status-badge" id="liveStatusBadge">
            Chargement du statut actuel...
        </div>

        <p style="font-size: 0.9rem; margin-bottom: 10px;">Sélectionne le résultat :</p>
        
        <button class="btn-fille" onclick="setChoice('fille')">Une petite fille ! 💖</button>
        <button class="btn-garcon" onclick="setChoice('garcon')">Un petit garçon ! 💙</button>
        
        <!-- Petit mot doux personnalisable -->
        <div class="input-group">
            <label for="motDouxInput">Petit mot doux (optionnel) :</label>
            <input type="text" id="motDouxInput" placeholder="ex: Prévu pour Décembre 2026">
            <button onclick="saveMotDoux()" style="background-color: #8c7355; padding: 8px; font-size: 0.9rem;">Enregistrer le mot doux ✨</button>
        </div>

        <p id="status"></p>
        <br>
        <a href="index.html" style="font-size: 0.9rem; color: #888; text-decoration: none;">← Retourner à la carte</a>
    </div>

    <!-- SECTION ADMINISTRATION DU LIVRE D'OR -->
    <div id="adminModSection" class="mod-section hidden">
        <h3>📖 Modération du Livre d'or</h3>
        <p style="font-size: 0.85rem; color: #7a685e; text-align: center;">Retrouvez ici tous les messages, ajoutez des cœurs, répondez ou supprimez.</p>
        
        <button class="btn-pdf" onclick="downloadBookPDF()">📥 Télécharger le Livre d'or en PDF</button>

        <div id="adminMessagesList" style="margin-top: 15px;">
            <p style="font-size: 0.85rem; color: #aaa; text-align: center;">Chargement des messages...</p>
        </div>
    </div>

    <!-- IMPORT CONFIG -->
    <script src="secrets.js"></script>

    <!-- IMPORT FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, update, remove, get, query, limitToLast } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app, databaseURL);

        const MOT_DE_PASSE_SECRET = "bebe2026"; 

        window.checkPassword = function() {
            const saisie = document.getElementById('passwordInput').value;
            if (saisie === MOT_DE_PASSE_SECRET) {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('adminInterface').classList.remove('hidden');
                document.getElementById('adminModSection').classList.remove('hidden');
                loadLiveStatus();
                loadAdminMessages();
            } else {
                document.getElementById('errorMsg').innerText = "Mot de passe incorrect !";
            }
        };

        function loadLiveStatus() {
            const annonceRef = ref(db, 'annonce');
            onValue(annonceRef, (snapshot) => {
                const data = snapshot.val();
                const badge = document.getElementById('liveStatusBadge');
                if (data && data.ligneSexe) {
                    badge.innerHTML = `📌 <b>Actuellement affiché :</b> ${data.ligneSexe}`;
                    if (data.ligneMotDoux) {
                        document.getElementById('motDouxInput').value = data.ligneMotDoux;
                    }
                } else {
                    badge.innerHTML = `📌 <b>Statut :</b> Non configuré`;
                }
            }, { onlyOnce: true });
        }

        function showNotification(message, isError = false) {
            const statusEl = document.getElementById('status');
            statusEl.style.color = isError ? "red" : "green";
            statusEl.innerText = message;
            statusEl.classList.add('show');
            setTimeout(() => {
                statusEl.classList.remove('show');
            }, 3000);
        }

        window.setChoice = function(sexe) {
            const annonceRef = ref(db, 'annonce');
            
            let dataToSend = {};
            if (sexe === 'fille') {
                dataToSend = {
                    ligneBebe: "BÉBÉ EST...",
                    ligneCoeur: "— ♡ —",
                    ligneSexe: "Une petite fille !",
                    confettiColors: ['#ffc0cb', '#ff69b4', '#ffffff']
                };
            } else {
                dataToSend = {
                    ligneBebe: "BÉBÉ EST...",
                    ligneCoeur: "— ♡ —",
                    ligneSexe: "Un petit garçon !",
                    confettiColors: ['#add8e6', '#87ceeb', '#ffffff']
                };
            }

            const currentMotDoux = document.getElementById('motDouxInput').value;
            if (currentMotDoux) dataToSend.ligneMotDoux = currentMotDoux;

            set(annonceRef, dataToSend).then(() => {
                showNotification("Choix enregistré avec succès ! ✨");
                confetti({ particleCount: 80, spread: 60, origin: { y: 0.6 } });
                loadLiveStatus();
            }).catch((error) => {
                showNotification("Erreur lors de l'enregistrement.", true);
            });
        }

        window.saveMotDoux = function() {
            const motDouxReel = document.getElementById('motDouxInput').value;
            const annonceRef = ref(db, 'annonce');
            
            update(annonceRef, { ligneMotDoux: motDouxReel }).then(() => {
                showNotification("Mot doux mis à jour ! 💌");
                loadLiveStatus();
            }).catch((error) => {
                showNotification("Erreur lors de la mise à jour.", true);
            });
        }

        function loadAdminMessages() {
            const messagesRef = query(ref(db, 'livre_or'), limitToLast(100));
            onValue(messagesRef, (snapshot) => {
                const listEl = document.getElementById('adminMessagesList');
                listEl.innerHTML = '';
                
                const data = snapshot.val();
                if (data) {
                    const messagesEntries = Object.entries(data).reverse();
                    messagesEntries.forEach(([id, item]) => {
                        const div = document.createElement('div');
                        div.className = 'mod-message-item';
                        
                        const hasHeart = item.coeur ? true : false;
                        const heartIcon = hasHeart ? '❤️' : '🤍';

                        div.innerHTML = `
                            <div class="mod-message-content">
                                <strong>${escapeHtml(item.name)}</strong>
                                <p>${escapeHtml(item.message)}</p>
                                ${item.reponse ? `<div style="margin-top: 8px; padding-left: 8px; border-left: 3px solid #d1a878; color: #8c7355; font-size: 0.85rem; font-style: italic;">↳ ${escapeHtml(item.reponse)}</div>` : ''}
                            </div>
                            <div class="mod-actions-bar">
                                <button class="mod-action-btn" onclick="toggleHeart('${id}', ${hasHeart})" title="Mettre un cœur">${heartIcon}</button>
                                <button class="mod-action-btn" onclick="repondreMessage('${id}')" title="Répondre">💬</button>
                                <button class="mod-delete-btn" onclick="deleteAdminMessage('${id}')">Supprimer 🗑️</button>
                            </div>
                        `;
                        listEl.appendChild(div);
                    });
                } else {
                    listEl.innerHTML = '<p style="font-size: 0.85rem; color: #aaa; text-align: center;">Aucun message pour le moment.</p>';
                }
            });
        }

        // Mettre ou enlever un cœur depuis l'interface amie
        window.toggleHeart = function(messageId, currentStatus) {
            const msgRef = ref(db, 'livre_or/' + messageId);
            update(msgRef, { coeur: !currentStatus });
        };

        // Répondre à un message depuis l'interface amie
        window.repondreMessage = function(messageId) {
            const reponse = prompt("Écris ta réponse à ce message :");
            if (reponse !== null && reponse.trim() !== "") {
                const msgRef = ref(db, 'livre_or/' + messageId);
                update(msgRef, { reponse: reponse.trim() });
            }
        };

        window.deleteAdminMessage = function(messageId) {
            if (confirm("Veux-tu vraiment supprimer ce message ?")) {
                const msgRef = ref(db, 'livre_or/' + messageId);
                remove(msgRef).catch((error) => {
                    alert("Erreur lors de la suppression.");
                });
            }
        };

        window.downloadBookPDF = function() {
            const messagesRef = query(ref(db, 'livre_or'), limitToLast(100));
            
            get(messagesRef).then((snapshot) => {
                const data = snapshot.val();
                if (!data) {
                    alert("Aucun message à exporter pour le moment !");
                    return;
                }

                const exportContainer = document.createElement('div');
                exportContainer.className = 'book-export-wrapper';
                
                let htmlContent = `
                    <h1 class="book-page-title">Livre d'Or de Bébé</h1>
                    <div class="book-page-subtitle">Les doux mots de nos proches et de notre famille</div>
                    <hr style="border: 0; border-top: 1px solid #d1a878; margin-bottom: 20px;">
                `;

                const messagesArray = Object.values(data).reverse();
                messagesArray.forEach((item) => {
                    const heartDisplay = item.coeur ? '<span style="float: right; color: #e74c3c;">❤️</span>' : '';
                    const reponseDisplay = item.reponse ? `
                        <div style="margin-top: 8px; padding: 8px; background-color: #f5f0ea; border-left: 3px solid #d1a878; font-size: 12px; color: #8c7355; font-style: italic;">
                            <strong>↳ Réponse :</strong> ${escapeHtml(item.reponse)}
                        </div>
                    ` : '';

                    htmlContent += `
                        <div class="book-message-card">
                            ${heartDisplay}
                            <strong>${escapeHtml(item.name)}</strong>
                            <p>${escapeHtml(item.message)}</p>
                            ${reponseDisplay}
                        </div>
                    `;
                });

                exportContainer.innerHTML = htmlContent;
                
                exportContainer.style.position = 'fixed';
                exportContainer.style.left = '0';
                exportContainer.style.top = '0';
                exportContainer.style.zIndex = '-9999';
                exportContainer.style.opacity = '0';
                document.body.appendChild(exportContainer);

                const options = {
                    margin:       10,
                    filename:     'Livre_d_or_bebe.pdf',
                    image:        { type: 'jpeg', quality: 0.98 },
                    html2canvas:  { scale: 1, useCORS: true, logging: true },
                    jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
                };

                html2pdf().from(exportContainer).set(options).save().then(() => {
                    document.body.removeChild(exportContainer);
                }).catch(err => {
                    console.error(err);
                    if (document.body.contains(exportContainer)) {
                        document.body.removeChild(exportContainer);
                    }
                    alert("Une erreur est survenue lors de la génération du PDF.");
                });
            }).catch((error) => {
                console.error(error);
                alert("Erreur lors de la récupération des messages.");
            });
        };

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
